name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.1
      - run: ruff check .

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r lesson1/requirements.txt
      - name: Smoke test lesson1
        working-directory: lesson1
        run: |
          python 01_check_ollama.py --help
          python 02_chat_stream.py --help
          python 03_vision.py --help
          python solution/02_chat_stream.py --help
          python solution/03_vision.py --help
